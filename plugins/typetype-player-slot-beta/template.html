<div class="typetype-beta" data-id="{{id}}">
  <div class="typetype-beta-card">
    {{#thumbnail}}
    <div class="typetype-beta-thumb" style="background-image:url('{{thumbnail}}')">
      <button class="typetype-beta-play-btn" aria-label="Watch video">▶</button>
    </div>
    {{/thumbnail}}
    <div class="typetype-beta-info">
      <div class="typetype-beta-title">{{title}}</div>
      {{#meta}}
      <div class="typetype-beta-meta">{{meta}}</div>
      {{/meta}}
      <div class="typetype-beta-actions">
        <a class="typetype-beta-watch-link" href="{{watchUrl}}" target="_blank" rel="noopener">Open in TypeType ↗</a>
      </div>
    </div>
  </div>
  <div class="typetype-beta-iframe-wrap" style="display:none">
    <iframe
      class="typetype-beta-iframe"
      data-src="{{embedUrl}}"
      width="100%" height="400"
      frameborder="0"
      allowfullscreen
      allow="autoplay; encrypted-media"
    ></iframe>
  </div>
  {{#debugInfo}}
  <div class="typetype-beta-debug" style="padding:6px 14px;font-size:11px;color:var(--degoog-text-secondary,#777);border-top:1px solid var(--degoog-border,#333);font-family:monospace">{{debugInfo}}</div>
  {{/debugInfo}}
</div>
