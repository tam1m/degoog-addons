<div class="typetype-player" data-id="{{id}}">
  <div class="typetype-player-card">
    {{#thumbnail}}
    <div class="typetype-player-thumb" style="background-image:url('{{thumbnail}}')">
      <button class="typetype-player-play-btn" aria-label="Watch video">▶</button>
    </div>
    {{/thumbnail}}
    <div class="typetype-player-info">
      <div class="typetype-player-title">{{title}}</div>
      {{#meta}}
      <div class="typetype-player-meta">{{meta}}</div>
      {{/meta}}
      <div class="typetype-player-actions">
        <a class="typetype-player-watch-link" href="{{watchUrl}}" target="_blank" rel="noopener">Open in TypeType ↗</a>
      </div>
    </div>
  </div>
  <div class="typetype-player-iframe-wrap" style="display:none">
    <iframe
      class="typetype-player-iframe"
      data-src="{{embedUrl}}"
      width="100%" height="400"
      frameborder="0"
      allowfullscreen
      allow="autoplay; encrypted-media"
    ></iframe>
  </div>
</div>
